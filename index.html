<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Languages Vocabulary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ancient Languages Vocabulary</h1>

        <div class="language-selector">
            <button data-language="latin">Latin</button>
            <button data-language="greek">Greek</button>
            <button data-language="akkadian">Akkadian</button>
            <button data-language="aramaic">Aramaic</button>
            <button data-language="all">All Languages</button>
        </div>

        <div class="current-language" id="current-language">All Languages</div>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search words..." oninput="filterWords()">
        </div>

        <div class="loading" id="loading">Loading...</div>

        <div class="words-container" id="words-container"></div>

        <div class="quiz-section">
            <h2>Quiz Mode</h2>
            <button id="start-quiz">Start Quiz</button>
            <div id="quiz-stats">Correct Answers: 0</div>
            <div id="quiz-question"></div>
            <div id="quiz-options"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
