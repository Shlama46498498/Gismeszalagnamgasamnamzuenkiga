<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon of Antiquity</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lexicon of Antiquity</h1>
            <p class="subtitle">A Vintage Dark Academia Vocabulary Tester</p>
        </header>

        <div class="controls">
            <select id="language-pair">
                <option value="data/latin_english.json">Latin ↔ English</option>
                <option value="data/english_greek.json">English ↔ Ancient Greek</option>
                <option value="data/assyrian_akkadian.json">Assyrian ↔ Akkadian</option>
                <option value="data/assyrian_russian.json">Assyrian ↔ Russian</option>
            </select>
            <button id="test-btn">Begin Test</button>
        </div>

        <div class="test-area">
            <div class="word-display">
                <p id="word"></p>
            </div>
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Your answer...">
                <button id="submit-btn">Submit</button>
            </div>
            <div class="feedback">
                <p id="feedback"></p>
            </div>
            <div class="stats">
                <p>Score: <span id="score">0</span> / <span id="total">0</span></p>
            </div>
        </div>

        <footer>
            <p>© 2023 Lexicon of Antiquity | A Dark Academia Study Aid</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
