<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antiquarium Vocabulary Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parchment-container">
        <header>
            <h1>Antiquarium</h1>
            <p class="subtitle">A Dark Academia Lexicon Scholar</p>
            <div class="divider"></div>
        </header>

        <main>
            <!-- Setup Screen -->
            <section id="setup-screen" class="view-section active">
                <p class="instruction-text">Select a lexicon repository to begin your examination:</p>
                <div class="dataset-grid">
                    <button class="btn-dataset" onclick="selectDataset('assyrian_akkadian')">
                        <span class="lang-title">Assyrian & Akkadian</span>
                        <span class="lang-desc">Cuneiform semantic comparisons</span>
                    </button>
                    <button class="btn-dataset" onclick="selectDataset('assyrian_russian')">
                        <span class="lang-title">Assyrian to Russian</span>
                        <span class="lang-desc">Eastern neo-Aramaic translation</span>
                    </button>
                    <button class="btn-dataset" onclick="selectDataset('english_greek')">
                        <span class="lang-title">English to Ancient Greek</span>
                        <span class="lang-desc">Hellenic philosophical vocabulary</span>
                    </button>
                    <button class="btn-dataset" onclick="selectDataset('latin_english')">
                        <span class="lang-title">Latin to English</span>
                        <span class="lang-desc">Classical Imperium dialect</span>
                    </button>
                </div>
            </section>

            <!-- Quiz Screen -->
            <section id="quiz-screen" class="view-section">
                <div class="quiz-meta">
                    <span id="quiz-title" class="deck-title">Dataset</span>
                    <span id="quiz-progress" class="progress-counter">Question 0/0</span>
                </div>
                
                <div class="card">
                    <p class="card-prompt">Translate the term:</p>
                    <h2 id="question-word" class="word-display">Word</h2>
                </div>

                <div id="options-container" class="options-grid">
                    <!-- Dynamic choices inserted here -->
                </div>

                <div id="feedback-panel" class="feedback-panel hidden">
                    <p id="feedback-message">Result text</p>
                    <button id="next-btn" class="btn-action" onclick="nextQuestion()">Advance Examination &rarr;</button>
                </div>
            </section>

            <!-- Results Screen -->
            <section id="results-screen" class="view-section">
                <h2 class="results-heading">Examination Terminated</h2>
                <div class="score-sphere">
                    <span id="final-score">0/0</span>
                </div>
                <p id="evaluation-text" class="evaluation-text">Your performance baseline.</p>
                <button class="btn-action" onclick="resetQuiz()">Return to Archives</button>
            </section>
        </main>

        <footer>
            <div class="divider"></div>
            <p class="footer-note">Ex Umbra In Solem &bull; Littera Scripta Manet</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
