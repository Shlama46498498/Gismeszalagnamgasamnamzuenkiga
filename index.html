<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Languages Library</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ancient Languages Library</h1>
            <p class="subtitle">A Vintage Academia Collection</p>
        </header>

        <div class="controls">
            <div class="language-selector">
                <label for="from-language">From:</label>
                <select id="from-language">
                    <option value="assyrian">Assyrian</option>
                    <option value="english">English</option>
                    <option value="latin">Latin</option>
                </select>

                <label for="to-language">To:</label>
                <select id="to-language">
                    <option value="akkadian">Akkadian</option>
                    <option value="russian">Russian</option>
                    <option value="greek">Greek</option>
                    <option value="english">English</option>
                </select>
            </div>

            <button id="load-btn">Load Dictionary</button>
        </div>

        <div class="dictionary-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search words...">
                <button id="search-btn">Search</button>
            </div>

            <div id="word-list" class="word-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
